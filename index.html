<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Загварлаг Хоол Захиалгын Чатбот</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .chat-container { 
            width: 400px; 
            height: 580px; 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .chat-header {
            background: #2d3748;
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        .chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            background: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        /* Сонголтын товчлууруудын хэсэг */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }
        .option-btn {
            background: #ffffff;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #667eea;
            color: white;
        }
        .input-box { 
            display: flex; 
            padding: 15px; 
            background: #ffffff; 
            border-top: 1px solid #e2e8f0; 
        }
        .input-box input { 
            flex: 1; 
            padding: 12px 15px; 
            border: 1px solid #cbd5e1; 
            border-radius: 30px; 
            outline: none; 
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-box input:focus {
            border-color: #667eea;
        }
        .input-box button { 
            background: #667eea; 
            color: white; 
            border: none; 
            padding: 0 20px; 
            margin-left: 8px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: 600;
            transition: background 0.2s;
        }
        .input-box button:hover { 
            background: #5a67d8; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 85%; 
            word-break: break-word; 
            font-size: 14px;
            line-height: 1.5;
        }
        .user-message { 
            background: #667eea; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px;
        }
        .bot-message { 
            background: #e2e8f0; 
            color: #1a202c; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">✨ Ресторан Туслах AI</div>
        <div id="chat-box" class="chat-box">
            <div class="message bot-message">
                Сайн байна уу? Манай рестораны захиалгын системд тавтай морилно уу. 🍔<br><br>Доорх цэснээс сонголтоо хийнэ үү:
                <div class="options-container">
                    <button class="option-btn" onclick="chooseFood('Бургер - 15,000₮')">🍔 Бургер - 15,000₮</button>
                    <button class="option-btn" onclick="chooseFood('Пицца - 25,000₮')">🍕 Пицца - 25,000₮</button>
                    <button class="option-btn" onclick="chooseFood('Кола - 4,000₮')">🥤 Кола - 4,000₮</button>
                </div>
            </div>
        </div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Утас болон хаягаа бичнэ үү..." onkeypress="handleKeyPress(event)" disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Игээх</button>
        </div>
    </div>

    <script>
        let selectedFood = "";
        let waitingForContact = false;

        // Хэрэглэгч товчлуураас хоол сонгох үед ажиллах функц
        function chooseFood(foodName) {
            selectedFood = foodName;
            waitingForContact = true;

            const chatBox = document.getElementById('chat-box');
            
            // Хэрэглэгчийн сонголтыг chat-box руу нэмэх
            chatBox.innerHTML += `<div class="message user-message">${foodName} сонголоо.</div>`;

            // Input болон товчлуурыг идэвхжүүлэх (Утас, хаяг бичихэд зориулж)
            document.getElementById('user-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('user-input').placeholder = "Утасны дугаар болон хүргэх хаягаа бичнэ үү...";
            document.getElementById('user-input').focus();

            // Чатботын хариуг түр хүлээж байгаад гаргах
            setTimeout(() => {
                const botResponse = `Таны сонгосон <strong>${foodName}</strong> бүртгэгдлээ! 🛵 Одоо утасны дугаар болон хүргэх хаягаа бичээд илгээнэ үү.`;
                chatBox.innerHTML += `<div class="message bot-message">${botResponse}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Хэрэглэгч утас, хаягаа бичиж илгээх үед ажиллах функц
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();
            
            if (!userText || !waitingForContact) return;

            // Хэрэглэгчийн бичсэн хаяг/утсыг гаргах
            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                const botResponse = `Баярлалаа! Таны захиалга (${selectedFood}) амжилттай баталгаажлаа. Бид таны бичсэн хаяг болон утас руу холбогдон хүргээд өгөх болно! 🚀`;
                chatBox.innerHTML += `<div class="message bot-message">${botResponse}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

                // Дахин захиалга хийх боломжтой болгох эсвэл хаах
                waitingForContact = false;
                document.getElementById('user-input').disabled = true;
                document.getElementById('send-btn').disabled = true;
                document.getElementById('user-input').placeholder = "Захиалга баталгаажсан.";
            }, 500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
