<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Миний AI Чатбот</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 350px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-box { flex: 1; height: 300px; padding: 15px; overflow-y: auto; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .input-box { display: flex; padding: 10px; background: #fff; }
        .input-box input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        .input-box button { background: #007bff; color: white; border: none; padding: 8px 15px; margin-left: 5px; border-radius: 4px; cursor: pointer; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; }
        .user-message { background: #007bff; color: white; align-self: flex-end; }
        .bot-message { background: #e4e6eb; color: black; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="chat-box" class="chat-box">
            <div class="message bot-message">Сайн байна уу? Би таны чатбот байна.</div>
        </div>
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Мессеж бичих..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Игээх</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();
            
            if (!userText) return;

            // Хэрэглэгчийн бичсэн зүйлийг гаргах
            chatBox.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Чатботын автоматаар хариулах энгийн логик
            setTimeout(() => {
                let botResponse = "Сонирхолтой асуулт байна. Би одоогоор туршилтын горимд байна.";
                
                if (userText.includes("сайн уу") || userText.includes("Сайн байна уу")) {
                    botResponse = "Сайн байна уу! Танд яаж туслах вэ?";
                } else if (userText.includes("нэр")) {
                    botResponse = "Намайг AI чатбот гэдэг.";
                }

                chatBox.innerHTML += `<div class="message bot-message">${botResponse}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
